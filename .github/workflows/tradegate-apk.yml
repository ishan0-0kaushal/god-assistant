name: TradeGate APK

on:
  push:
    paths: ['tradegate/**', '.github/workflows/tradegate-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradegate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tradegate/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit && npm test
      - run: npx expo prebuild -p android --no-install
      # Release build, signed with the template's debug key — installable for personal use.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: tradegate/android
      - uses: actions/upload-artifact@v4
        with:
          name: TradeGate-apk
          path: tradegate/android/app/build/outputs/apk/release/app-release.apk
